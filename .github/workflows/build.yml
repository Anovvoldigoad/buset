name: Build NSC Mod Manager (WinForms)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    # WinForms (like WPF) needs the Microsoft.WindowsDesktop.App reference assemblies
    # and, for a fully clean build, a Windows runner.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NSC-ModManager-2.0.1.1/NSC-ModManager.csproj

      - name: Build (Release)
        run: dotnet build NSC-ModManager-2.0.1.1/NSC-ModManager.csproj -c Release --no-restore

      - name: Publish framework-dependent build
        run: >
          dotnet publish NSC-ModManager-2.0.1.1/NSC-ModManager.csproj
          -c Release
          --no-restore
          --self-contained false
          -o publish_output

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: NSC-ModManager-build
          path: publish_output/
          if-no-files-found: error
