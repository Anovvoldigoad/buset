name: Build NSC Mod Manager (x64)

# Repo tunggal: NSC-ModManager/ + XFBIN_LIB/ sebagai sibling folder
# (NSC-ModManager.csproj mereferensikan ..\XFBIN_LIB\XFBIN_LIB.csproj)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Lapis 1: paksa false di level environment CI, jaga-jaga kalau runner
  # windows-latest punya default implisit yang mengaktifkan invariant mode.
  # WPF TIDAK BISA JALAN SAMA SEKALI di mode ini (lihat komentar di .csproj).
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 'false'

jobs:
  build:
    runs-on: windows-latest   # WPF butuh Windows Desktop targeting pack untuk build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore NSC-ModManager/NSC-ModManager.csproj

      - name: Build (Release, x64)
        run: >
          dotnet build NSC-ModManager/NSC-ModManager.csproj
          -c Release
          -p:Platform=x64
          -p:InvariantGlobalization=false
          --no-restore

      - name: Publish (self-contained, single folder, x64)
        run: >
          dotnet publish NSC-ModManager/NSC-ModManager.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          -p:InvariantGlobalization=false
          --self-contained true
          -p:PublishSingleFile=false
          -o publish/NSC-ModManager-win-x64

      - name: Verifikasi runtimeconfig.json (InvariantGlobalization HARUS false/absen)
        shell: pwsh
        run: |
          $cfgPath = "publish/NSC-ModManager-win-x64/NSC_ModManager.runtimeconfig.json"
          Write-Host "=== Isi $cfgPath ==="
          Get-Content $cfgPath | Write-Host
          $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
          $invariant = $cfg.runtimeOptions.configProperties.'System.Globalization.Invariant'
          if ($invariant -eq $true) {
            Write-Error "GAGAL: System.Globalization.Invariant = true di runtimeconfig.json hasil publish! WPF tidak akan bisa jalan (crash MS.Internal.FontCache.MajorLanguages). Build dihentikan supaya tidak menghasilkan artifact yang pasti crash."
            exit 1
          } else {
            Write-Host "OK: System.Globalization.Invariant tidak true (nilai: $invariant)"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSC-ModManager-win-x64
          path: publish/NSC-ModManager-win-x64/**
          if-no-files-found: error

  release:
    # Hanya jalan saat push tag versi (contoh: v2.1.0) — bikin GitHub Release otomatis
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: NSC-ModManager-win-x64
          path: publish/NSC-ModManager-win-x64

      - name: Zip artifact
        run: |
          Compress-Archive -Path publish/NSC-ModManager-win-x64/* -DestinationPath NSC-ModManager-win-x64.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NSC-ModManager-win-x64.zip
          generate_release_notes: true
