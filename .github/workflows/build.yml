name: Build NSC Mod Manager (x64)

# Repo tunggal: NSC-ModManager/ + XFBIN_LIB/ sebagai sibling folder
# (NSC-ModManager.csproj mereferensikan ..\XFBIN_LIB\XFBIN_LIB.csproj)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest   # WPF butuh Windows Desktop targeting pack untuk build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore NSC-ModManager/NSC-ModManager.csproj

      - name: Build (Release, x64)
        run: >
          dotnet build NSC-ModManager/NSC-ModManager.csproj
          -c Release
          -p:Platform=x64
          --no-restore

      - name: Publish (self-contained, single folder, x64)
        run: >
          dotnet publish NSC-ModManager/NSC-ModManager.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          --self-contained true
          -p:PublishSingleFile=false
          -o publish/NSC-ModManager-win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSC-ModManager-win-x64
          path: publish/NSC-ModManager-win-x64/**
          if-no-files-found: error

  release:
    # Hanya jalan saat push tag versi (contoh: v2.1.0) — bikin GitHub Release otomatis
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: NSC-ModManager-win-x64
          path: publish/NSC-ModManager-win-x64

      - name: Zip artifact
        run: |
          Compress-Archive -Path publish/NSC-ModManager-win-x64/* -DestinationPath NSC-ModManager-win-x64.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NSC-ModManager-win-x64.zip
          generate_release_notes: true
